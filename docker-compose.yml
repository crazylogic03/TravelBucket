services:
  postgres:
    image: postgres:16-alpine
    container_name: yolo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yolo
      POSTGRES_PASSWORD: yolo_dev_password
      POSTGRES_DB: yolo
    ports:
      - '5432:5432'
    volumes:
      - yolo_pg_data:/var/lib/postgresql/data

volumes:
  yolo_pg_data:
